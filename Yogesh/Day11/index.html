<!DOCTYPE html>
<html>
<head>
    <title>Element Selectors Demo</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }

        .student {
            color: blue;
        }

        .course {
            color: green;
        }

        .box {
            border: 2px solid black;
            padding: 10px;
            margin: 10px;
        }
    </style>
</head>
<body>

    <h1 id="mainHeading">Student Management System</h1>

    <h2>Students</h2>

    <p class="student">Yogesh</p>
    <p class="student">Rahul</p>
    <p class="student">Kiran</p>

    <h2>Courses</h2>

    <p class="course">JavaScript</p>
    <p class="course">Node.js</p>
    <p class="course">React</p>

    <div class="box">
        First Box
    </div>

    <div class="box">
        Second Box
    </div>

    <button onclick="changeData()">
        Click Here
    </button>

    <script src="index.js"></script>

</body>
</html>
